{% extends 'base.html' %}
{% block title %}{{ title }} - HostelHub{% endblock %}
{% block content %}
<div class="form-container">
    <h2>{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="field-error">{{ field.errors }}</div>{% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'rooms:list' %}" class="btn">Cancel</a>
    </form>
</div>
{% endblock %}
