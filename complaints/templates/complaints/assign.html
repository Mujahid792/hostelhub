{% extends 'base.html' %}
{% block title %}Assign Complaint - HostelHub{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Assign Complaint #{{ complaint.pk }}</h2>
    <p><strong>{{ complaint.title }}</strong></p>
    <p>{{ complaint.description }}</p>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'complaints:track' %}" class="btn">Cancel</a>
    </form>
</div>
{% endblock %}
